<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Sentinel Bangladesh</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07110d;color:#fff}
    .hidden{display:none!important}.top{position:sticky;top:0;background:#0a1812;padding:15px;display:flex;justify-content:space-between;border-bottom:1px solid #1d3b2d}.logo{color:#22e58b;font-size:22px;font-weight:bold}
    .container{max-width:700px;margin:auto;padding:15px}.card{background:#0d1c16;border:1px solid #1f4938;border-radius:18px;padding:16px;margin-bottom:15px}.auth{max-width:420px;margin:60px auto}.auth h1{text-align:center;color:#22e58b}
    input,textarea{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #285642;background:#08130f;color:white;font-size:16px}textarea{min-height:100px;resize:vertical}
    button{border:0;border-radius:12px;padding:12px 16px;background:#20d884;color:#032016;font-weight:bold;font-size:15px;cursor:pointer}.btn2{background:#18352a;color:#dfffee}.row{display:flex;gap:10px}.row button{flex:1}
    .postHead{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#22e58b;color:#062215;display:flex;align-items:center;justify-content:center;font-weight:bold}.post{white-space:pre-wrap;font-size:16px;line-height:1.5;margin:14px 0}.meta{color:#9cc8b3;font-size:12px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{background:#10271d;color:#bff5d7}.comment{padding:10px;border-top:1px solid #1b3d2e;font-size:14px}.comment b{color:#21df8a}.profileBox{text-align:center}.profileBox .avatar{margin:0 auto 10px;width:70px;height:70px;font-size:26px}.msg{text-align:center;margin:10px;color:#ffb3b3}.ok{color:#7dffb3}.title{font-size:26px;color:#27e695;text-align:center;margin:20px 0}
  </style>
</head>
<body>

<div id="authPage" class="container auth">
  <div class="card">
    <h1>🛡 CSB Social</h1>
    <p style="text-align:center;color:#9cc8b3">Cyber Sentinel Bangladesh</p>
    <div id="loginBox">
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPass" type="password" placeholder="Password">
      <button onclick="login()" style="width:100%">Login</button>
      <p style="text-align:center">নতুন? <span onclick="showRegister()" style="color:#22e58b;cursor:pointer">Register</span></p>
    </div>
    <div id="registerBox" class="hidden">
      <input id="regName" placeholder="Full Name">
      <input id="regEmail" type="email" placeholder="Email">
      <input id="regPass" type="password" placeholder="Password (6+)">
      <button onclick="register()" style="width:100%">Create Account</button>
      <p style="text-align:center">আগে account আছে? <span onclick="showLogin()" style="color:#22e58b;cursor:pointer">Login</span></p>
    </div>
    <div id="msg" class="msg"></div>
  </div>
</div>

<div id="appPage" class="hidden">
  <div class="top">
    <div class="logo">🛡 CSB</div>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="container">
    <div class="card profileBox">
      <div class="avatar" id="avatar">U</div>
      <h2 id="userName">User</h2>
      <div id="userEmail" class="meta"></div>
    </div>

    <div class="card">
      <h3>নতুন Post</h3>
      <textarea id="postText" placeholder="কি ভাবছেন?"></textarea>
      <button onclick="createPost()" style="width:100%">Post Publish</button>
    </div>

    <div class="title">News Feed</div>
    <div id="feed"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBU-KZ_CRAS_AKNfgJjimU-f-74qoJHUko",authDomain:"facebook-de936.firebaseapp.com",projectId:"facebook-de936",storageBucket:"facebook-de936.firebasestorage.app",messagingSenderId:"575188853255",appId:"1:575188853255:web:52a913cdd44243baa340a2",measurementId:"G-JSFH705D24"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); let currentUser=null;
const $=id=>document.getElementById(id); const msg=t=>{$('msg').innerText=t;setTimeout(()=>$('msg').innerText='',3000)};
window.showRegister=()=>{$('loginBox').classList.add('hidden');$('registerBox').classList.remove('hidden')}; window.showLogin=()=>{$('registerBox').classList.add('hidden');$('loginBox').classList.remove('hidden')};
window.register=async()=>{const name=$('regName').value.trim(),email=$('regEmail').value.trim(),pass=$('regPass').value;if(!name||!email||pass.length<6)return msg('সব তথ্য দিন, password 6+');try{const r=await createUserWithEmailAndPassword(auth,email,pass);await setDoc(doc(db,'users',r.user.uid),{name,email,createdAt:serverTimestamp()});msg('Account তৈরি হয়েছে')}catch(e){msg(e.message)}};
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPass').value)}catch(e){msg('Login failed')}}; window.logout=()=>signOut(auth);
window.createPost=async()=>{const text=$('postText').value.trim();if(!text)return;await addDoc(collection(db,'posts'),{uid:currentUser.uid,name:currentUser.name,text,likes:[],createdAt:serverTimestamp()});$('postText').value=''};
window.likePost=async(id,likes)=>{const ref=doc(db,'posts',id);const has=likes.includes(currentUser.uid);await updateDoc(ref,{likes:has?arrayRemove(currentUser.uid):arrayUnion(currentUser.uid)})};
window.deletePost=async id=>{if(confirm('Delete post?'))await deleteDoc(doc(db,'posts',id))};
window.commentPost=async id=>{const text=prompt('Comment লিখুন');if(text&&text.trim())await addDoc(collection(db,'posts',id,'comments'),{uid:currentUser.uid,name:currentUser.name,text:text.trim(),createdAt:serverTimestamp()})};
function listenPosts(){const q=query(collection(db,'posts'),orderBy('createdAt','desc'));onSnapshot(q,s=>{const feed=$('feed');feed.innerHTML='';s.forEach(d=>{const p=d.data(),likes=p.likes||[];const div=document.createElement('div');div.className='card';const own=p.uid===currentUser.uid;div.innerHTML=`<div class="postHead"><div class="avatar">${(p.name||'U')[0].toUpperCase()}</div><div><b>${p.name}</b><div class="meta">${p.createdAt?.toDate?.().toLocaleString()||'Just now'}</div></div></div><div class="post">${escapeHtml(p.text)}</div><div class="actions"><button onclick="likePost('${d.id}',${JSON.stringify(likes).replace(/"/g,'&quot;')})">❤️ ${likes.length}</button><button onclick="commentPost('${d.id}')">💬 Comment</button>${own?`<button onclick="deletePost('${d.id}')">🗑 Delete</button>`:''}</div><div id="c-${d.id}"></div>`;feed.appendChild(div);onSnapshot(collection(db,'posts',d.id,'comments'),cs=>{const c=$('c-'+d.id);c.innerHTML='';cs.forEach(x=>{const z=x.data();c.innerHTML+=`<div class="comment"><b>${z.name}</b><br>${escapeHtml(z.text)}</div>`})})})})}
function escapeHtml(t){return t.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
onAuthStateChanged(auth,async u=>{if(u){const s=await getDoc(doc(db,'users',u.uid));const data=s.data()||{name:'User',email:u.email};currentUser={uid:u.uid,...data};$('authPage').classList.add('hidden');$('appPage').classList.remove('hidden');$('userName').innerText=currentUser.name;$('userEmail').innerText=currentUser.email;$('avatar').innerText=currentUser.name[0].toUpperCase();listenPosts()}else{$('appPage').classList.add('hidden');$('authPage').classList.remove('hidden')}});
</script>
</body>
</html>
