<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSB Social</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#020806;
  color:#fff;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* AUTH */

#authPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#063d29 0,#050b09 45%,#020504 100%);
}

.authBox{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid #08754c;
  border-radius:25px;
  background:rgba(3,18,13,.96);
  box-shadow:0 0 35px rgba(0,255,140,.18);
}

.logo{
  text-align:center;
  color:#00ff88;
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
  text-shadow:0 0 15px #00ff88;
}

.subtitle{
  text-align:center;
  color:#8da99c;
  margin-bottom:25px;
}

.authBox input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #164d39;
  border-radius:12px;
  outline:none;
  background:#07130f;
  color:white;
  font-size:16px;
}

.authBox input:focus{
  border-color:#00ff88;
}

.mainBtn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#00e878;
  color:#001b0e;
  font-size:16px;
  font-weight:bold;
}

.mainBtn:hover{
  background:#00ff91;
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#8da99c;
}

.switch span{
  color:#00ff88;
  cursor:pointer;
  font-weight:bold;
}

.error{
  color:#ff6969;
  text-align:center;
  margin-top:12px;
  min-height:20px;
}

/* APP */

#app{
  display:none;
  min-height:100vh;
}

.topbar{
  height:65px;
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:rgba(2,12,8,.97);
  border-bottom:1px solid #0b4c32;
  backdrop-filter:blur(10px);
}

.brand{
  color:#00ff88;
  font-size:21px;
  font-weight:bold;
  text-shadow:0 0 12px rgba(0,255,136,.5);
}

.topActions{
  display:flex;
  gap:7px;
}

.iconBtn{
  border:1px solid #164d39;
  background:#07130f;
  color:#00ff88;
  padding:9px 11px;
  border-radius:10px;
}

.iconBtn:hover{
  background:#0b2b1e;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:20px 12px 80px;
}

/* PROFILE */

.profile{
  padding:20px;
  margin-bottom:18px;
  border:1px solid #104e37;
  border-radius:20px;
  background:#06120e;
}

.profileTop{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#00c96b;
  color:#001b0e;
  font-size:25px;
  font-weight:bold;
}

.profileInfo{
  flex:1;
}

.profileName{
  font-size:20px;
  font-weight:bold;
}

.profileEmail{
  color:#7f998f;
  font-size:13px;
  margin-top:4px;
}

.stats{
  display:flex;
  gap:25px;
  margin-top:18px;
}

.stat{
  color:#9ab2a8;
  font-size:14px;
}

.stat b{
  color:#00ff88;
  font-size:18px;
}

.editProfileBtn{
  margin-top:15px;
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #176043;
  background:#07130f;
  color:#00ff88;
}

/* CREATE */

.create{
  padding:18px;
  margin-bottom:20px;
  border:1px solid #104e37;
  border-radius:20px;
  background:#06120e;
}

.create h3{
  color:#00ff88;
  margin-bottom:12px;
}

.create input,
.create textarea{
  width:100%;
  background:#020906;
  color:white;
  border:1px solid #164d39;
  border-radius:12px;
  padding:13px;
  outline:none;
  margin-bottom:10px;
}

.create textarea{
  min-height:110px;
  resize:vertical;
}

/* POSTS */

.post{
  background:#06120e;
  border:1px solid #104e37;
  border-radius:20px;
  margin-bottom:18px;
  overflow:hidden;
}

.postHead{
  display:flex;
  gap:12px;
  align-items:center;
  padding:16px;
}

.smallAvatar{
  width:43px;
  height:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#00b961;
  color:#001b0e;
  font-weight:bold;
}

.postUser{
  font-weight:bold;
}

.postTime{
  color:#71877e;
  font-size:12px;
  margin-top:3px;
}

.followBtn{
  margin-left:auto;
  padding:7px 12px;
  border-radius:9px;
  border:1px solid #00d875;
  background:transparent;
  color:#00ff88;
}

.followBtn.following{
  background:#00d875;
  color:#001b0e;
}

.postMenu{
  margin-left:auto;
  display:flex;
  gap:3px;
}

.menuBtn{
  border:0;
  background:transparent;
  color:#8da99c;
  font-size:18px;
  padding:5px;
}

.menuBtn:hover{
  color:#00ff88;
}

.postBody{
  padding:0 16px 15px;
}

.postTitle{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
  color:#00ff88;
}

.postText{
  color:#d9e5df;
  white-space:pre-wrap;
  line-height:1.5;
}

.postActions{
  display:flex;
  border-top:1px solid #0c3022;
}

.action{
  flex:1;
  padding:13px 5px;
  border:0;
  background:transparent;
  color:#91aaa0;
}

.action:hover,
.action.liked{
  color:#00ff88;
  background:#092219;
}

/* COMMENTS */

.comments{
  border-top:1px solid #0c3022;
  padding:12px 16px;
}

.comment{
  padding:8px 0;
  color:#c6d5cf;
  font-size:14px;
}

.comment b{
  color:#00ff88;
}

.commentForm{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.commentForm input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid #164d39;
  background:#020906;
  color:white;
  outline:none;
}

.commentForm button{
  border:0;
  border-radius:10px;
  padding:0 15px;
  background:#00d875;
  font-weight:bold;
}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalBox{
  width:100%;
  max-width:450px;
  background:#06120e;
  border:1px solid #176043;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 40px #000;
}

.modalBox h2{
  color:#00ff88;
  margin-bottom:15px;
}

.modalBox input,
.modalBox textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  background:#020906;
  border:1px solid #164d39;
  border-radius:10px;
  color:white;
  outline:none;
}

.modalBox textarea{
  min-height:130px;
  resize:vertical;
}

.modalActions{
  display:flex;
  gap:8px;
}

.modalActions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
}

.saveBtn{
  background:#00d875;
  color:#001b0e;
  font-weight:bold;
}

.cancelBtn{
  background:#18251f;
  color:white;
}

/* NOTIFICATION */

.notificationPanel{
  display:none;
  position:fixed;
  top:70px;
  right:10px;
  width:310px;
  max-height:420px;
  overflow:auto;
  z-index:80;
  background:#06120e;
  border:1px solid #176043;
  border-radius:15px;
  box-shadow:0 10px 35px #000;
}

.notificationPanel h3{
  padding:15px;
  color:#00ff88;
  border-bottom:1px solid #104e37;
}

.notification{
  padding:12px 15px;
  border-bottom:1px solid #0d3022;
  color:#c7d6d0;
  font-size:14px;
}

.notification small{
  display:block;
  color:#6f887d;
  margin-top:4px;
}

/* EMPTY */

.empty{
  text-align:center;
  color:#71877e;
  padding:45px 10px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#00ff88;
}

@media(max-width:500px){

  .brand{
    font-size:18px;
  }

  .container{
    padding-left:8px;
    padding-right:8px;
  }

  .stats{
    gap:16px;
  }

  .notificationPanel{
    left:10px;
    right:10px;
    width:auto;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authPage">

<div class="authBox">

<div class="logo">🛡️ CSB Social</div>

<div class="subtitle">
Cyber Sentinel Bangladesh
</div>

<div id="loginForm">

<input id="loginEmail"
type="email"
placeholder="Email">

<input id="loginPassword"
type="password"
placeholder="Password">

<button class="mainBtn" onclick="login()">
Login
</button>

<div class="switch">
নতুন account?
<span onclick="showSignup()">Sign Up</span>
</div>

</div>

<div id="signupForm" style="display:none">

<input id="signupName"
type="text"
placeholder="Your name">

<input id="signupEmail"
type="email"
placeholder="Email">

<input id="signupPassword"
type="password"
placeholder="Password (minimum 6 characters)">

<button class="mainBtn" onclick="signup()">
Create Account
</button>

<div class="switch">
আগে থেকেই account আছে?
<span onclick="showLogin()">Login</span>
</div>

</div>

</div>

<!-- APP -->

<section id="app">

<header class="topbar">

<div class="brand">
🛡️ CSB Social
</div>

<div class="topActions">

<button class="iconBtn"
onclick="toggleNotifications()">
🔔 <span id="notificationCount">0</span>
</button>

<button class="iconBtn"
onclick="logout()">
Logout
</button>

</header>


<div id="notificationPanel"
class="notificationPanel">

<h3>🔔 Notifications</h3>

<div id="notifications">
<div class="empty">No notifications</div>
</div>

</div>


<main class="container">

<!-- PROFILE -->

<div class="profile">

<div class="profileTop">

<div class="avatar"
id="profileAvatar">
U
</div>

<div class="profileInfo">

<div class="profileName"
id="profileName">
User
</div>

<div class="profileEmail"
id="profileEmail">
email
</div>

</div>

</div>

<div class="stats">

<div class="stat">
<b id="followersCount">0</b><br>
Followers
</div>

<div class="stat">
<b id="followingCount">0</b><br>
Following
</div>

<div class="stat">
<b id="postCount">0</b><br>
Posts
</div>

</div>

<button class="editProfileBtn"
onclick="openProfileEdit()">
✏️ Edit Profile
</button>

</div>


<!-- CREATE POST -->

<div class="create">

<h3>📝 Create Post</h3>

<input
id="postTitle"
placeholder="Post title">

<textarea
id="postText"
placeholder="What's on your mind?"></textarea>

<button class="mainBtn"
onclick="createPost()">
Publish Post
</button>

<div id="feed">

<div class="loading">
Loading posts...
</div>

</div>

</main>

</section>


<!-- PROFILE EDIT MODAL -->

<div id="profileModal"
class="modal">

<div class="modalBox">

<h2>✏️ Edit Profile</h2>

<input
id="editName"
type="text"
maxlength="50"
placeholder="Your name">

<div class="modalActions">

<button class="cancelBtn"
onclick="closeProfileEdit()">
Cancel
</button>

<button class="saveBtn"
onclick="saveProfile()">
Save
</button>

</div>

</div>

</div>


<!-- POST EDIT MODAL -->

<div id="postModal"
class="modal">

<div class="modalBox">

<h2>✏️ Edit Post</h2>

<input
id="editPostTitle"
maxlength="100"
placeholder="Post title">

<textarea
id="editPostText"
placeholder="Post text"></textarea>

<div class="modalActions">

<button class="cancelBtn"
onclick="closePostEdit()">
Cancel
</button>

<button class="saveBtn"
onclick="savePostEdit()">
Save
</button>

</div>

</div>

</div>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBU-KZ_CRAS_AKNfgJjimU-f-74qoJHUko",
  authDomain: "facebook-de936.firebaseapp.com",
  projectId: "facebook-de936",
  storageBucket: "facebook-de936.firebasestorage.app",
  messagingSenderId: "575188853255",
  appId: "1:575188853255:web:52a913cdd44243baa340a2",
  measurementId: "G-JSFH705D24"
};


/* =========================================
   INITIALIZE
========================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

let postsListener = null;

let notificationListener = null;

let currentEditPostId = null;

let commentListeners = {};


/* =========================================
   AUTH UI
========================================= */

function showSignup(){

  document.getElementById("loginForm").style.display="none";

  document.getElementById("signupForm").style.display="block";

  document.getElementById("authError").innerText="";
}


function showLogin(){

  document.getElementById("signupForm").style.display="none";

  document.getElementById("loginForm").style.display="block";

  document.getElementById("authError").innerText="";
}


/* =========================================
   SIGN UP
========================================= */

async function signup(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const error =
    document.getElementById("authError");


  if(!name || !email || !password){

    error.innerText="সবগুলো ঘর পূরণ করো।";

    return;
  }


  if(password.length < 6){

    error.innerText=
      "Password কমপক্ষে ৬ characters হতে হবে।";

    return;
  }


  try{

    const result =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );


    const user=result.user;


    await db.collection("users")
      .doc(user.uid)
      .set({

        uid:user.uid,

        name:name,

        email:email,

        followers:[],

        following:[],

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    error.innerText="";

  }catch(e){

    error.innerText=firebaseError(e);

  }

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const error =
    document.getElementById("authError");


  if(!email || !password){

    error.innerText=
      "Email এবং password দাও।";

    return;
  }


  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    error.innerText="";

  }catch(e){

    error.innerText=firebaseError(e);

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await auth.signOut();

}


/* =========================================
   FIREBASE ERROR
========================================= */

function firebaseError(error){

  const code=error.code || "";


  if(code.includes("invalid-email"))
    return "Email address ঠিক নয়।";


  if(code.includes("user-not-found"))
    return "এই email দিয়ে account নেই।";


  if(code.includes("wrong-password"))
    return "Password ভুল।";


  if(code.includes("invalid-credential"))
    return "Email অথবা password ভুল।";


  if(code.includes("email-already-in-use"))
    return "এই email দিয়ে account আগে থেকেই আছে।";


  if(code.includes("weak-password"))
    return "Password আরও শক্ত করো।";


  if(code.includes("permission-denied"))
    return "Firebase permission denied। Rules check করো।";


  return error.message ||
         "Something went wrong.";

}


/* =========================================
   AUTH STATE
========================================= */

auth.onAuthStateChanged(async(user)=>{

  if(user){

    document.getElementById("authPage")
      .style.display="none";

    document.getElementById("app")
      .style.display="block";


    await ensureUserProfile(user);

    await loadProfile(user);

    loadPosts();

    loadNotifications();

  }else{

    document.getElementById("authPage")
      .style.display="flex";

    document.getElementById("app")
      .style.display="none";


    if(postsListener){

      postsListener();

      postsListener=null;

    }


    if(notificationListener){

      notificationListener();

      notificationListener=null;

    }

  }

});


/* =========================================
   ENSURE PROFILE
========================================= */

async function ensureUserProfile(user){

  const ref =
    db.collection("users").doc(user.uid);

  const snap =
    await ref.get();


  if(!snap.exists){

    const defaultName =
      user.email
      ?user.email.split("@")[0]
      :"User";


    await ref.set({

      uid:user.uid,

      name:defaultName,

      email:user.email || "",

      followers:[],

      following:[],

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }

}


/* =========================================
   GET PROFILE
========================================= */

async function getProfile(uid){

  const snap =
    await db.collection("users")
      .doc(uid)
      .get();


  if(snap.exists){

    return snap.data();

  }


  return null;

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(user){

  const data =
    await getProfile(user.uid);


  const name =
    data && data.name
      ?data.name
      :(user.email
        ?user.email.split("@")[0]
        :"User");


  document.getElementById("profileName")
    .innerText=name;


  document.getElementById("profileEmail")
    .innerText=user.email || "";


  document.getElementById("profileAvatar")
    .innerText=
      name.charAt(0).toUpperCase();


  document.getElementById("followersCount")
    .innerText=
      data && Array.isArray(data.followers)
        ?data.followers.length
        :0;


  document.getElementById("followingCount")
    .innerText=
      data && Array.isArray(data.following)
        ?data.following.length
        :0;


  await loadMyPostCount();

}


/* =========================================
   POST COUNT
========================================= */

async function loadMyPostCount(){

  const user=auth.currentUser;

  if(!user)return;


  try{

    const snap =
      await db.collection("posts")
        .where("uid","==",user.uid)
        .get();


    document.getElementById("postCount")
      .innerText=snap.size;

  }catch(e){

    console.error(e);

  }

}


/* =========================================
   EDIT PROFILE
========================================= */

async function openProfileEdit(){

  const user=auth.currentUser;

  if(!user)return;


  const data =
    await getProfile(user.uid);


  document.getElementById("editName")
    .value=
      data && data.name
        ?data.name
        :"";


  document.getElementById("profileModal")
    .style.display="flex";

}


function closeProfileEdit(){

  document.getElementById("profileModal")
    .style.display="none";

}


async function saveProfile(){

  const user=auth.currentUser;

  if(!user)return;


  const name =
    document.getElementById("editName")
      .value.trim();


  if(!name){

    alert("Name দাও।");

    return;
  }


  if(name.length>50){

    alert("Name সর্বোচ্চ ৫০ characters হতে পারবে।");

    return;
  }


  try{

    await db.collection("users")
      .doc(user.uid)
      .update({

        name:name

      });


    closeProfileEdit();


    await loadProfile(user);


    loadPosts();


    alert("Profile successfully updated! ✅");

  }catch(e){

    alert(
      "Profile update করা যায়নি:\n"+
      e.message
    );

  }

}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

  const user=auth.currentUser;

  if(!user)return;


  const title =
    document.getElementById("postTitle")
      .value.trim();


  const text =
    document.getElementById("postText")
      .value.trim();


  if(!title || !text){

    alert("Title এবং post লিখো।");

    return;
  }


  const profile =
    await getProfile(user.uid);


  const name =
    profile && profile.name
      ?profile.name
      :(user.email
        ?user.email.split("@")[0]
        :"User");


  try{

    await db.collection("posts")
      .add({

        uid:user.uid,

        name:name,

        title:title,

        text:text,

        likes:[],

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    document.getElementById("postTitle")
      .value="";


    document.getElementById("postText")
      .value="";


    await loadMyPostCount();

  }catch(e){

    alert(
      "Post করা যায়নি:\n"+
      e.message
    );

  }

}


/* =========================================
   LOAD POSTS
========================================= */

function loadPosts(){

  const feed =
    document.getElementById("feed");


  feed.innerHTML =
    '<div class="loading">Loading posts...</div>';


  if(postsListener){

    postsListener();

  }


  postsListener =
    db.collection("posts")
      .orderBy("createdAt","desc")
      .onSnapshot(

        async(snapshot)=>{

          if(snapshot.empty){

            feed.innerHTML =
              '<div class="empty">'+
              'এখনো কোনো post নেই।<br>'+
              'প্রথম post তুমি করো! 🚀'+
              '</div>';

            return;
          }


          feed.innerHTML="";


          for(const doc of snapshot.docs){

            await renderPost(
              doc.id,
              doc.data()
            );

          }

        },

        error=>{

          console.error(error);


          feed.innerHTML =
            '<div class="empty">'+
            'Posts load করা যায়নি।<br>'+
            escapeHTML(error.message)+
            '</div>';

        }

      );

}


/* =========================================
   RENDER POST
========================================= */

async function renderPost(id,data){

  const feed =
    document.getElementById("feed");


  const user=auth.currentUser;

  if(!user)return;


  const likes =
    Array.isArray(data.likes)
      ?data.likes
      :[];


  const liked =
    likes.includes(user.uid);


  const time =
    data.createdAt
      ?data.createdAt.toDate()
          .toLocaleString()
      :"Just now";


  const ownPost =
    data.uid===user.uid;


  let following=false;


  if(!ownPost){

    const target =
      await getProfile(data.uid);


    following =
      target &&
      Array.isArray(target.followers) &&
      target.followers.includes(user.uid);

  }


  const article =
    document.createElement("article");


  article.className="post";


  article.innerHTML=`

<div class="postHead">

<div class="smallAvatar">
${escapeHTML(
  (data.name||"U")
  .charAt(0)
  .toUpperCase()
)}
</div>

<div>

<div class="postUser">
${escapeHTML(data.name||"User")}
</div>

<div class="postTime">
${escapeHTML(time)}
</div>

</div>

${
!ownPost
?
`
<button
class="followBtn ${following?"following":""}"
onclick="toggleFollow('${id}','${data.uid}')">

${following?"Following":"Follow"}

</button>
`
:""
}

${
ownPost
?
`
<div class="postMenu">

<button
class="menuBtn"
title="Edit"
onclick="openPostEdit(
'${id}',
'${escapeAttr(data.title||"")}',
'${escapeAttr(data.text||"")}'
)">
✏️
</button>

<button
class="menuBtn"
title="Delete"
onclick="deletePost('${id}')">
🗑️
</button>

</div>
`
:""
}

</div>


<div class="postBody">

<div class="postTitle">
${escapeHTML(data.title||"")}
</div>

<div class="postText">
${escapeHTML(data.text||"")}
</div>

</div>


<div class="postActions">

<button
class="action ${liked?"liked":""}"
onclick="toggleLike('${id}')">

${liked?"❤️":"🤍"} ${likes.length}

</button>


<button
class="action"
onclick="focusComment('${id}')">

💬 Comment

</button>

</div>


<div class="comments">

<div id="comments-${id}">

<span style="color:#61776e">
Loading comments...
</span>

</div>


<div class="commentForm">

<input
id="commentInput-${id}"
placeholder="Write a comment...">

<button
onclick="addComment('${id}')">
Send
</button>

</div>

</div>

`;


  feed.appendChild(article);


  loadComments(id);

}


/* =========================================
   LIKE
========================================= */

async function toggleLike(postId){

  const user=auth.currentUser;

  if(!user)return;


  const ref =
    db.collection("posts")
      .doc(postId);


  try{

    const snap=await ref.get();


    if(!snap.exists)return;


    const data=snap.data();


    const likes =
      Array.isArray(data.likes)
        ?data.likes
        :[];


    if(likes.includes(user.uid)){

      await ref.update({

        likes:
          firebase.firestore.FieldValue
            .arrayRemove(user.uid)

      });

    }else{

      await ref.update({

        likes:
          firebase.firestore.FieldValue
            .arrayUnion(user.uid)

      });


      if(data.uid!==user.uid){

        await createNotification(
          data.uid,
          "❤️",
          "তোমার পোস্টে Like দেওয়া হয়েছে।"
        );

      }

    }

  }catch(e){

    console.error(e);

  }

}


/* =========================================
   EDIT POST
========================================= */

function escapeAttr(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}


function openPostEdit(id,title,text){

  currentEditPostId=id;


  document.getElementById("editPostTitle")
    .value=title;


  document.getElementById("editPostText")
    .value=text;


  document.getElementById("postModal")
    .style.display="flex";

}


function closePostEdit(){

  currentEditPostId=null;


  document.getElementById("postModal")
    .style.display="none";

}


async function savePostEdit(){

  const user=auth.currentUser;

  if(!user || !currentEditPostId)return;


  const title =
    document.getElementById("editPostTitle")
      .value.trim();


  const text =
    document.getElementById("editPostText")
      .value.trim();


  if(!title || !text){

    alert("Title এবং text দাও।");

    return;
  }


  try{

    const ref =
      db.collection("posts")
        .doc(currentEditPostId);


    const snap=await ref.get();


    if(!snap.exists){

      alert("Post পাওয়া যায়নি.");

      return;
    }


    if(snap.data().uid!==user.uid){

      alert("এই post edit করার অনুমতি নেই।");

      return;
    }


    await ref.update({

      title:title,

      text:text,

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });


    closePostEdit();

  }catch(e){

    alert(
      "Post update করা যায়নি:\n"+
      e.message
    );

  }

}


/* =========================================
   DELETE POST
========================================= */

async function deletePost(postId){

  const user=auth.currentUser;

  if(!user)return;


  const yes =
    confirm(
      "এই post delete করতে চাও?"
    );


  if(!yes)return;


  try{

    const ref =
      db.collection("posts")
        .doc(postId);


    const snap=await ref.get();


    if(!snap.exists)return;


    if(snap.data().uid!==user.uid){

      alert(
        "এই post delete করার অনুমতি নেই।"
      );

      return;
    }


    await ref.delete();


    await loadMyPostCount();


    alert("Post deleted. 🗑️");

  }catch(e){

    alert(
      "Delete করা যায়নি:\n"+
      e.message
    );

  }

}


/* =========================================
   COMMENTS
========================================= */

function loadComments(postId){

  if(commentListeners[postId]){

    commentListeners[postId]();

  }


  commentListeners[postId] =
    db.collection("posts")
      .doc(postId)
      .collection("comments")
      .orderBy("createdAt","asc")
      .onSnapshot(

        snapshot=>{

          const box =
            document.getElementById(
              "comments-"+postId
            );


          if(!box)return;


          box.innerHTML="";


          snapshot.forEach(doc=>{

            const data=doc.data();


            const div=
              document.createElement("div");


            div.className="comment";


            div.innerHTML =
              "<b>"+
              escapeHTML(
                data.name||"User"
              )+
              "</b>: "+
              escapeHTML(
                data.text||""
              );


            box.appendChild(div);

          });

        },

        error=>{

          console.error(
            "Comment error:",
            error
          );

        }

      );

}


async function addComment(postId){

  const user=auth.currentUser;

  if(!user)return;


  const input =
    document.getElementById(
      "commentInput-"+postId
    );


  const text =
    input.value.trim();


  if(!text)return;


  const profile =
    await getProfile(user.uid);


  const name =
    profile && profile.name
      ?profile.name
      :(user.email
        ?user.email.split("@")[0]
        :"User");


  try{

    const postSnap =
      await db.collection("posts")
        .doc(postId)
        .get();


    await db.collection("posts")
      .doc(postId)
      .collection("comments")
      .add({

        uid:user.uid,

        name:name,

        text:text,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    input.value="";


    if(
      postSnap.exists &&
      postSnap.data().uid!==user.uid
    ){

      await createNotification(
        postSnap.data().uid,
        "💬",
        name+" তোমার পোস্টে Comment করেছে।"
      );

    }

  }catch(e){

    alert(
      "Comment করা যায়নি:\n"+
      e.message
    );

  }

}


function focusComment(postId){

  const input =
    document.getElementById(
      "commentInput-"+postId
    );


  if(input){

    input.focus();


    input.scrollIntoView({

      behavior:"smooth",

      block:"center"

    });

  }

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow(postElementId,targetUid){

  const user=auth.currentUser;

  if(!user)return;


  if(user.uid===targetUid)return;


  const myRef =
    db.collection("users")
      .doc(user.uid);


  const targetRef =
    db.collection("users")
      .doc(targetUid);


  try{

    const me=await myRef.get();

    const target=await targetRef.get();


    if(!me.exists || !target.exists){

      alert("User profile পাওয়া যায়নি।");

      return;

    }


    const myData=me.data();

    const targetData=target.data();


    const following =
      Array.isArray(myData.following)
        ?myData.following
        :[];


    const isFollowing =
      following.includes(targetUid);


    if(isFollowing){

      await myRef.update({

        following:
          firebase.firestore.FieldValue
            .arrayRemove(targetUid)

      });


      await targetRef.update({

        followers:
          firebase.firestore.FieldValue
            .arrayRemove(user.uid)

      });

    }else{

      await myRef.update({

        following:
          firebase.firestore.FieldValue
            .arrayUnion(targetUid)

      });


      await targetRef.update({

        followers:
          firebase.firestore.FieldValue
            .arrayUnion(user.uid)

      });


      await createNotification(
        targetUid,
        "👥",
        "কেউ তোমাকে Follow করেছে।"
      );

    }


    await loadProfile(user);

    loadPosts();

  }catch(e){

    alert(
      "Follow update করা যায়নি:\n"+
      e.message
    );

  }

}


/* =========================================
   NOTIFICATION
========================================= */

async function createNotification(
  uid,
  icon,
  text
){

  const user=auth.currentUser;

  if(!user)return;

  if(uid===user.uid)return;


  try{

    await db.collection("notifications")
      .add({

        to:uid,

        from:user.uid,

        icon:icon,

        text:text,

        read:false,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

  }catch(e){

    console.error(
      "Notification error:",
      e
    );

  }

}


function loadNotifications(){

  const user=auth.currentUser;

  if(!user)return;


  if(notificationListener){

    notificationListener();

  }


  notificationListener =
    db.collection("notifications")
      .where("to","==",user.uid)
      .onSnapshot(

        snapshot=>{

          const box =
            document.getElementById(
              "notifications"
            );


          const count =
            document.getElementById(
              "notificationCount"
            );


          let unread=0;

          const items=[];


          snapshot.forEach(doc=>{

            const data=doc.data();


            if(!data.read){

              unread++;

            }


            items.push({

              id:doc.id,

              data:data

            });

          });


          items.sort((a,b)=>{

            const ta =
              a.data.createdAt
                ?a.data.createdAt.toMillis()
                :0;


            const tb =
              b.data.createdAt
                ?b.data.createdAt.toMillis()
                :0;


            return tb-ta;

          });


          box.innerHTML="";


          if(!items.length){

            box.innerHTML =
              '<div class="empty">'+
              'No notifications'+
              '</div>';

          }else{

            items.slice(0,30)
              .forEach(item=>{

                const div =
                  document.createElement(
                    "div"
                  );


                div.className=
                  "notification";


                const when =
                  item.data.createdAt
                    ?item.data.createdAt
                        .toDate()
                        .toLocaleString()
                    :"Just now";


                div.innerHTML =
                  escapeHTML(
                    item.data.icon||"🔔"
                  )+
                  " "+
                  escapeHTML(
                    item.data.text||
                    "Notification"
                  )+
                  "<small>"+
                  escapeHTML(when)+
                  "</small>";


                box.appendChild(div);

              });

          }


          count.innerText=unread;

        },

        error=>{

          console.error(
            "Notification error:",
            error
          );

        }

      );

}


function toggleNotifications(){

  const panel =
    document.getElementById(
      "notificationPanel"
    );


  const visible =
    panel.style.display==="block";


  panel.style.display =
    visible
      ?"none"
      :"block";


  if(!visible){

    markNotificationsRead();

  }

}


async function markNotificationsRead(){

  const user=auth.currentUser;

  if(!user)return;


  try{

    const snap =
      await db.collection("notifications")
        .where("to","==",user.uid)
        .where("read","==",false)
        .get();


    if(snap.empty)return;


    const batch=db.batch();


    snap.forEach(doc=>{

      batch.update(

        doc.ref,

        {

          read:true

        }

      );

    });


    await batch.commit();

  }catch(e){

    console.error(e);

  }

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================================
   MODAL CLOSE
========================================= */

document.addEventListener(
  "click",
  function(e){

    const profileModal =
      document.getElementById(
        "profileModal"
      );


    const postModal =
      document.getElementById(
        "postModal"
      );


    if(e.target===profileModal){

      closeProfileEdit();

    }


    if(e.target===postModal){

      closePostEdit();

    }

  }
);
